[mypy]
# Mypy Configuration for SHYPN
# Architecture-Aware Type Checking
# Generated: 2026-02-18

# Python version
python_version = 3.8

# Focus on safe zones (avoid architecture zones until they need type updates)
files = src/shypn/engine/**/*.py,src/shypn/thermodynamics/**/*.py,src/shypn/crossfetch/**/*.py,src/shypn/export/**/*.py,src/shypn/topology/**/*.py

# Exclude architecture zones (already have type hints, avoid breaking tests)
exclude = (?x)(
    ^src/shypn/events/event_bus\.py$
    | ^src/shypn/helpers/base_panel_loader\.py$
    | ^src/shypn/helpers/.*_panel_loader\.py$
    | ^src/shypn/data/canvas/document_model\.py$
    | ^src/shypn/data/canvas/id_manager\.py$
)

# Import discovery
ignore_missing_imports = True
follow_imports = skip
namespace_packages = True

# Disallow untyped definitions
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# None and Optional checks
no_implicit_optional = True
strict_optional = True

# Warnings
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = False
warn_unreachable = True

# Error messages
show_error_context = True
show_column_numbers = True
show_error_codes = True
pretty = True

# Miscellaneous
strict_equality = True
warn_unused_configs = True

# Per-module options for gradual typing

[mypy-tests.*]
ignore_errors = True

[mypy-setup]
ignore_errors = True

# External dependencies (ignore missing stubs)
[mypy-gi.*]
ignore_missing_imports = True

[mypy-cairo.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True
