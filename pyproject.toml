[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shypn"
version = "2.7.1"
description = "Signal Hierarchical Petri Nets (SHYpn) - Extended Biological Petri Net Framework with Signal Hierarchy Theory for Systems Biology Modeling and Analysis"
authors = [
    { name="Simão Eugénio", email="simao-eugenio@github.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # GUI framework (requires system GTK3 libraries — see INSTALL.md)
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
    # Numerical / scientific
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.6.0",
    "networkx>=2.8.0",
    # Data / reports
    "weasyprint>=60.0",
    "openpyxl>=3.1.0",
    # Utilities
    "platformdirs>=4.0.0",
    "requests>=2.31.0",
    # XML parsing (KEGG, BRENDA, SABIO-RK fetchers)
    "defusedxml>=0.7.1",
    # SBML support
    "python-libsbml>=5.20.0",
]

[project.optional-dependencies]
thermodynamics = [
    "requests>=2.31.0",
]
acceleration = [
    "numba>=0.59.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.4",
    "ruff>=0.1",
    "pre-commit>=3.0",
    "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/simao-eugenio/shypn"
Documentation = "https://github.com/simao-eugenio/shypn/tree/main/doc"
Repository = "https://github.com/simao-eugenio/shypn"
Paper = "https://arxiv.org/abs/2512.17106"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shypn*", "shypn.api*"]

[project.scripts]
# Main GUI entry point
shypn = "shypn.__main__:main"

# Experimental validation tools
shypn-setup-experiment = "cli.experimental.setup_experiment:main"
shypn-run-replicates = "cli.experimental.run_replicates:main"
shypn-batch-replicates = "cli.experimental.run_batch_replicates:main"
shypn-benchmark-timing = "cli.experimental.benchmark_timing:main"
shypn-validate-equivalence = "cli.experimental.validate_equivalence:main"
shypn-analyze-dependency-impact = "cli.experimental.analyze_dependency_impact:main"
shypn-plot-validation = "cli.experimental.plot_validation_results:main"
shypn-plot-speedup-analysis = "cli.experimental.plot_speedup_analysis:main"
shypn-generate-report = "cli.experimental.generate_experiment_report:main"

# Data acquisition tools
shypn-fetch-biomodels = "cli.data.fetch_biomodels:main"

# Model analysis tools
shypn-classify-dependencies = "cli.analysis.classify_dependencies:main"
shypn-validate-topology = "cli.analysis.validate_topology:main"
shypn-validate-sbml = "cli.analysis.validate_sbml_conversion:main"

# Visualization tools
shypn-plot-speedup = "cli.visualization.plot_speedup:main"
