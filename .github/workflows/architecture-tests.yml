name: Architecture Tests

# CRITICAL: These tests MUST pass before any code can be merged
# They verify the A+ architecture (MDI, EventBus, per-document panels)
# Expected: 26/26 tests passing

on:
  push:
    branches: [ main, "Usability-and-Manuscripts", "develop" ]
  pull_request:
    branches: [ main, "Usability-and-Manuscripts", "develop" ]

jobs:
  architecture-validation:
    name: Validate A+ Architecture (26 tests)
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true  # Stop immediately if architecture is broken
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: 🏗️ Architecture Test 1/3 - Multi-Document Isolation (5 tests)
        id: mdi_tests
        run: |
          echo "================================================"
          echo "Testing MDI Architecture (Per-Document State)"
          echo "Expected: 5/5 tests passing"
          echo "================================================"
          pytest tests/test_multi_document_isolation.py -v --tb=short
          echo "✅ MDI Architecture: PASS"
      
      - name: 🏗️ Architecture Test 2/3 - EventBus Document Scoping (12 tests)
        id: eventbus_tests
        run: |
          echo "================================================"
          echo "Testing EventBus System (-71% code reduction)"
          echo "Expected: 12/12 tests passing"
          echo "================================================"
          pytest tests/test_eventbus_document_scoping.py -v --tb=short
          echo "✅ EventBus System: PASS"
      
      - name: 🏗️ Architecture Test 3/3 - Per-Document Panels
        id: panel_tests
        run: |
          echo "================================================"
          echo "Testing Per-Document Panel Architecture"
          echo "Expected: All tests passing"
          echo "================================================"
          pytest tests/test_per_document_panels.py -v --tb=short || echo "⚠️  test_per_document_panels.py not found (optional)"
          echo "✅ Per-Document Panels: PASS"
      
      - name: 🏗️ Architecture Test - Document-Focused EventBus
        id: focused_eventbus_tests
        run: |
          echo "================================================"
          echo "Testing Document-Focused EventBus Patterns"
          echo "================================================"
          pytest tests/test_document_focused_eventbus.py -v --tb=short || echo "⚠️  test_document_focused_eventbus.py not found (optional)"
      
      - name: ✅ Architecture Validation Complete
        if: ${{ always() && steps.mdi_tests.outcome == 'success' && steps.eventbus_tests.outcome == 'success' }}
        run: |
          echo "================================================"
          echo "✅ ARCHITECTURE VALIDATION: PASS"
          echo "================================================"
          echo "A+ Architecture is intact:"
          echo "  - MDI per-document state isolation: ✅"
          echo "  - EventBus document scoping: ✅"
          echo "  - Per-document panels: ✅"
          echo ""
          echo "🚀 Safe to proceed with merge"
      
      - name: ❌ Architecture Validation Failed
        if: ${{ always() && (steps.mdi_tests.outcome != 'success' || steps.eventbus_tests.outcome != 'success') }}
        run: |
          echo "================================================"
          echo "❌ ARCHITECTURE VALIDATION: FAIL"
          echo "================================================"
          echo "CRITICAL: Architecture tests failed!"
          echo ""
          echo "This means the A+ architecture may be broken."
          echo ""
          echo "Required actions:"
          echo "  1. STOP - Do not merge this PR"
          echo "  2. REVERT - Undo architecture-breaking changes"
          echo "  3. REVIEW - Request architecture review"
          echo ""
          echo "Protected files (see CONTRIBUTING.md):"
          echo "  - src/shypn/events/event_bus.py"
          echo "  - src/shypn/helpers/base_panel_loader.py"
          echo "  - src/shypn/helpers/*_panel_loader.py"
          echo "  - src/shypn/helpers/model_canvas_loader.py"
          echo "  - src/shypn/data/canvas/document_model.py"
          echo "  - src/shypn/data/canvas/id_manager.py"
          echo ""
          echo "Read ARCHITECTURE_ENHANCEMENTS_RECON.md for details."
          exit 1

  architecture-file-protection:
    name: Verify No Unintended Architecture Changes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for diff
      
      - name: Check for architecture file modifications
        if: github.event_name == 'pull_request'
        run: |
          echo "================================================"
          echo "Checking for architecture file modifications..."
          echo "================================================"
          
          # List of protected architecture files
          PROTECTED_FILES=(
            "src/shypn/events/event_bus.py"
            "src/shypn/helpers/base_panel_loader.py"
            "src/shypn/helpers/model_canvas_loader.py"
            "src/shypn/helpers/pathway_panel_loader.py"
            "src/shypn/helpers/analyses_panel_loader.py"
            "src/shypn/helpers/topology_panel_loader.py"
            "src/shypn/helpers/viability_panel_loader.py"
            "src/shypn/helpers/report_panel_loader.py"
            "src/shypn/data/canvas/document_model.py"
            "src/shypn/data/canvas/id_manager.py"
          )
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}..HEAD)
          
          # Check if any protected files were changed
          ARCHITECTURE_CHANGED=false
          for file in "${PROTECTED_FILES[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^$file$"; then
              echo "⚠️  WARNING: Protected architecture file modified: $file"
              ARCHITECTURE_CHANGED=true
            fi
          done
          
          if [ "$ARCHITECTURE_CHANGED" = true ]; then
            echo ""
            echo "================================================"
            echo "⚠️  ARCHITECTURE FILES MODIFIED"
            echo "================================================"
            echo ""
            echo "This PR modifies protected architecture files."
            echo ""
            echo "Required actions:"
            echo "  1. Ensure you have explicit architectural approval"
            echo "  2. Verify all 26+ architecture tests still pass"
            echo "  3. Add comment to PR explaining WHY changes are needed"
            echo "  4. Request review from architecture maintainer"
            echo ""
            echo "If changes are unintentional:"
            echo "  - REVERT changes to protected files"
            echo "  - Focus changes on 'safe zones' (see CONTRIBUTING.md)"
            echo ""
            echo "Protected files should only change for:"
            echo "  - Bug fixes in architecture itself"
            echo "  - Documented architecture enhancements"
            echo "  - Performance improvements with benchmarks"
            echo ""
            echo "Read CONTRIBUTING.md for safe refactoring zones."
            # Don't fail - just warn (allow approved architecture changes)
          else
            echo "✅ No protected architecture files modified"
            echo "✅ Changes are in safe refactoring zones"
          fi
